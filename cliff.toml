# git-cliff renders the release notes from the commit log, reading the type
# and scope off each subject. The release workflow runs it for the tag being
# released; `git cliff --unreleased` previews what the next tag would say.

[changelog]
# Rendered once per release. `version` is the tag being released and is
# unset for --unreleased, hence the fallback heading.
body = """{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | split(pat="@") | last }}

{% for commit in commits %}\
- {% if commit.breaking %}**breaking** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ self::repo_url() }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
{% if version and previous and previous.version %}\
**Full changelog**: {{ self::repo_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif %}\
{%- macro repo_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""

trim = true

[git]
conventional_commits = true
# A subject with no `type(scope):` prefix carries nothing to group it by, so
# it is dropped rather than landing in the notes ungrouped. A merge commit is
# the usual case.
filter_unconventional = true
# Likewise for a commit no parser below puts in a group. The last parser
# claims every remaining type, so this is only a safeguard.
filter_commits = true
split_commits = false
# A breaking change is never skipped, whatever its type.
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# The first matching parser wins, and types match in any case. Each type is
# matched up to the scope, "!" or colon that ends it, so a longer type that
# merely starts with one, such as fixture or testing, falls through to the
# last parser. Groups render in alphabetical order, so each name carries a
# numeric sort prefix that the template strips at the "@", putting the
# sections in the order below. scripts/check-changelog-groups.sh holds the
# parsers to this.
commit_parsers = [
  { message = "(?i)^feat[(!:]", group = "0@Features" },
  { message = "(?i)^fix[(!:]", group = "1@Bug fixes" },
  { message = "(?i)^perf[(!:]", group = "2@Performance" },
  { message = "(?i)^refactor[(!:]", group = "3@Refactoring" },
  { message = "(?i)^revert[(!:]", group = "4@Reverts" },
  { message = "(?i)^docs[(!:]", group = "5@Documentation" },
  { message = "(?i)^test[(!:]", group = "6@Tests" },
  { message = "(?i)^(build|ci)[(!:]", group = "7@Build & CI" },
  { message = "(?i)^chore\\(deps\\)", group = "8@Dependencies" },
  # Every other type, such as chore and style, is housekeeping that says
  # nothing to someone reading the notes to decide whether to upgrade. A
  # breaking one is still kept and needs the group.
  { message = ".*", group = "9@Other breaking changes", skip = true },
]
