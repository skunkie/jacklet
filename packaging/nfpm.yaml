# nfpm builds the .deb and the .rpm from this one file, and needs neither
# dpkg-deb nor rpmbuild nor a machine of the target architecture to do it,
# so the release workflow packages arm64 on the same amd64 runner that
# cross-compiled the binary.
#
# ARCH, VERSION and REPO_URL come from the environment, REPO_URL from the
# release workflow, which is where the repository's own URL is kept. Paths
# are relative to the repository root, which is where nfpm is invoked from.

name: jacklet
arch: ${ARCH}
platform: linux
version: ${VERSION}
# Strips the tag's leading "v" and turns a pre-release into one that sorts
# below the release it precedes: v1.2.3-rc.1 becomes 1.2.3~rc.1 for dpkg.
version_schema: semver
maintainer: TorrPlay <noreply@users.noreply.github.com>
description: |
  Lightweight Torznab/Newznab indexer proxy.
  Jacklet exposes torrent sites as Torznab endpoints for Sonarr, Radarr and
  Prowlarr, scraping them with Jackett's own Cardigann YAML definitions. It
  is a single static binary with no runtime dependencies.
vendor: TorrPlay
homepage: ${REPO_URL}
license: MIT
section: net
priority: optional

# A file with no mode of its own below arrives with the one the working
# tree gave it, and a checkout made under a group-writable umask would put
# group-writable files in the package. nfpm's own default is 0o002, which
# lets that through.
umask: 0o022

contents:
  - src: ./dist/jacklet
    dst: /usr/bin/jacklet
    file_info:
      mode: 0755

  # Both Debian and Fedora read units from /usr/lib/systemd/system, and on
  # a usr-merged system -- Debian 12+, Ubuntu 20.04+, every current RPM
  # distribution -- /lib/systemd/system is the same directory.
  - src: ./packaging/jacklet.service
    dst: /usr/lib/systemd/system/jacklet.service
    file_info:
      mode: 0644

  # Readable by the service account and no one else: this is where
  # JACKLET_API_KEY and the admin password hash end up. noreplace keeps an
  # upgrade from overwriting what the operator edited.
  - src: ./packaging/jacklet.env
    dst: /etc/jacklet/jacklet.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: jacklet

  # systemd's StateDirectory= creates /var/lib/jacklet at startup, but the
  # operator drops definitions in before the first start, so the tree has
  # to exist from installation. config/ matches the 0700 the server itself
  # creates it with, since per-indexer settings hold tracker credentials in
  # plaintext.
  - dst: /var/lib/jacklet
    type: dir
    file_info:
      mode: 0750
      owner: jacklet
      group: jacklet
  - dst: /var/lib/jacklet/definitions
    type: dir
    file_info:
      mode: 0750
      owner: jacklet
      group: jacklet
  - dst: /var/lib/jacklet/config
    type: dir
    file_info:
      mode: 0700
      owner: jacklet
      group: jacklet

  # Generated by packaging/mkman, which the release workflow runs before
  # this file is packaged. Already gzipped, as man(1) expects them.
  - src: ./man/man1/jacklet.1.gz
    dst: /usr/share/man/man1/jacklet.1.gz
  - src: ./man/man7
    dst: /usr/share/man/man7
    type: tree

  - src: ./README.md
    dst: /usr/share/doc/jacklet/README.md
    file_info:
      mode: 0644
  # Each packaging convention wants the licence text under its own name:
  # dpkg looks for a copyright file in the package's doc directory, and
  # nothing outside Debian knows that name.
  - src: ./LICENSE
    dst: /usr/share/doc/jacklet/copyright
    packager: deb
  - src: ./LICENSE
    dst: /usr/share/doc/jacklet/LICENSE
    packager: rpm
    file_info:
      mode: 0644
  # The README is a landing page that links into docs/, so the package
  # carries that directory too rather than leaving the links pointing at a
  # branch that has moved past this version.
  - src: ./docs
    dst: /usr/share/doc/jacklet/docs
    type: tree

scripts:
  preinstall: ./packaging/scripts/preinstall.sh
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh

rpm:
  summary: Lightweight Torznab/Newznab indexer proxy
  group: Applications/Internet
