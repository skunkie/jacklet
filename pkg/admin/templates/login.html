{{template "head" "Sign in"}}
<main class="login">
  <div class="wordmark">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="{{mark}}"/></svg>
    <h1>{{title}}</h1>
  </div>
  <p class="muted">Administration</p>
  {{if .Problem}}<div class="note bad" role="alert">{{.Problem}}</div>{{end}}
  <form class="card" action="{{prefix}}/login" method="post">
    {{if .Next}}<input name="next" type="hidden" value="{{.Next}}">{{end}}
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    </div>
    <button type="submit">Sign in</button>
  </form>
</main>
{{template "foot"}}
